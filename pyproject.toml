[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-biz-cli"
version = "0.1.0"
description = "CLI tool for local business lead generation, enrichment, and demo site deployment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jack Nolan"}]
keywords = ["lead-generation", "local-business", "cli", "web-scraping", "demo-sites"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
local-biz = "local_biz.cli:main"

[tool.setuptools.packages.find]
include = ["local_biz*"]
